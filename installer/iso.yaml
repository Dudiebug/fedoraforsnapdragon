# image-builder generic-iso settings (copied to /usr/lib/image-builder/bootc/iso.yaml).
# The kernel arguments the installed system gets from kargs.d, so the installer's
# display and USB survive until their drivers load. No "quiet": a failed boot shows why.
label: "SL7-Kinoite-Installer"
grub2:
  timeout: 10
  entries:
    - name: "Install Fedora Kinoite for the Surface Laptop 7"
      linux: "/images/pxeboot/vmlinuz inst.stage2=hd:LABEL=SL7-Kinoite-Installer inst.graphical selinux=0 clk_ignore_unused pd_ignore_unused systemd.tpm2_wait=0"
      initrd: "/images/pxeboot/initrd.img"
