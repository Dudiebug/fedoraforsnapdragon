# Surface Laptop 7 haptic touchpad (HID over SPI, 045E:0C77).
# Contact sizes: iptsd-calibrate on the 15-inch model (bryce-hoehn/linux-surface-laptop-7,
# 1273 samples, slack 0.5); 1Martin11 uses the same values on the 13.8-inch model.
# Recalibrate with: sudo iptsd-calibrate $(iptsd-find-hidraw) and put the result in
# /etc/iptsd.d/ (it overrides this preset).
# Touchpad: the alex-lentz fork's click debounce and palm suppression (1Martin11's values).

[Device]
Vendor = 0x045E
Product = 0x0C77

[Contacts]
SizeMin = 0.200
SizeMax = 6.200
AspectMin = 1.000
AspectMax = 5.600

[Touchpad]
ButtonDebounceMs = 25
DisableOnPalm = true
