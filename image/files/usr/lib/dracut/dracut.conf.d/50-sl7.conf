# Surface Laptop 7 initramfs (built once, in the image, with --no-hostonly).
#
# In: the keyboard (Surface aggregator over the GENI UART), the touch transports, and the
# USB and NVMe paths a USB stick or the internal SSD boots through. Built-in drivers
# (pinctrl, GCC, interconnect, GENI, PCIe) need nothing here.
add_drivers+=" surface_aggregator surface_aggregator_registry surface_aggregator_hub surface_hid surface_kbd hid_generic "
add_drivers+=" spi_hid spi_geni_qcom gpi i2c_hid_of hid_multitouch "
add_drivers+=" dwc3 dwc3_qcom phy_qcom_qmp_combo phy_qcom_qmp_usb phy_qcom_eusb2_repeater phy_snps_eusb2 onboard_usb_dev usb_storage uas "
add_drivers+=" phy_qcom_qmp_pcie nvme "
#
# Out: everything that loads Microsoft/Qualcomm firmware. That firmware is in
# /var/lib/firmware, which the initramfs cannot see, and these drivers ask once: loaded
# from the initramfs, the DSPs, GPU and video decoder would fail for the whole boot.
# Early display is the UEFI framebuffer (simpledrm); msm takes over after switch-root.
# Both spellings of qcom-iris: dracut matches the module file name.
omit_drivers+=" qcom_q6v5_pas msm qcom-iris qcom_iris ath12k "
