# The Surface Laptop 7 kernel: Fedora's own kernel SRPM (from Koji), rebuilt with
# patches/series and config.fragment. Sourced by build-rpm.sh and the kernel workflow.
#
# Base: the first Fedora build of the kernel the patch series targets (7.3). When the
# Fedora release below gets a 7.3.x update, switch to it (kernel-7.3.x-200.fc44) so
# the kernel tracks stable; the series is checked against the exact tree on every build.
KERNEL_SRPM=kernel-7.3.0-65.fc46
KERNEL_SRPM_SHA256=38f6f2a9a59bf20faa65dbd1783aab7e50bddb83dbf1e09ca8deea40b6809c62
# Release tag: kernel-7.3.0-65.sl7.fc44, uname 7.3.0-65.sl7.fc44.aarch64. Bump to .sl7.1,
# .sl7.2 ... for a new patch set or config on the same SRPM.
SL7_BUILDID=.sl7
# Fedora release the RPMs are built on and the image is based on.
FEDORA_RELEASE=44
# Which device tree the 13.8-inch hardware IDs (SKU Surface_Laptop_7th_Edition_2036)
# select in the dtbloader image: spi-touch (this unit, GTCH on spi10) or i2c (ITCH
# panel). The panel depends on the supplier, not the SKU, so it is a build choice.
SL7_ROMULUS13_TOUCH=spi-touch
# The owner's laptop, hardware ID from Manufacturer + Family + ProductName + ProductSku
# ("Microsoft Corporation&Surface&Microsoft Surface Laptop, 7th Edition&
# Surface_Laptop_7th_Edition_2036"). The build checks the dtbloader image maps it to
# the tree above. It is in stubble's stock Romulus13 list.
SL7_CHID=11696377-327d-5ad1-b01d-02a7dbb9b99a
